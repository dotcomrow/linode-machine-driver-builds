name: Build & Release Linode Machine Driver

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Linode driver version tag (e.g. v0.1.9)'
        required: true

jobs:
  build-and-release:
    name: Build Linode Driver and Create GitHub Release
    runs-on: ubuntu-latest

    steps:
    - name: Checkout empty repo
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.21'

    - name: Clone Linode driver repo
      run: |
        git clone https://github.com/linode/docker-machine-driver-linode.git
        cd docker-machine-driver-linode
        git checkout "${{ github.event.inputs.version }}"
        mv * ../
        cd ..
        rm -rf docker-machine-driver-linode

    - name: Build Linux AMD64 binary
      run: |
        GOOS=linux GOARCH=amd64 go build -o docker-machine-driver-linode

    - name: Generate SHA256 checksum
      id: checksum
      run: |
        echo "sha256=$(sha256sum docker-machine-driver-linode | awk '{print $1}')" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
      with:
        token: ${{ env.GH_TOKEN }}
        tag_name: ${{ github.event.inputs.version }}
        name: Release ${{ github.event.inputs.version }}
        files: docker-machine-driver-linode
        body: |
            Linode Docker Machine Driver ${{ github.event.inputs.version }}
            - Built for Linux AMD64
            - SHA256: `${{ steps.checksum.outputs.sha256 }}`
      env:
        GH_TOKEN: ${{ secrets.GH_PAT }}
